<!doctype html>
<html lang="zh-Hant" style="color-scheme: light only;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#f7f3ec" />
    <title>智慧遊台北 — Nash Pages</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <style>
      html { color-scheme: light only !important; -webkit-text-size-adjust: 100%; }
      :root { forced-color-adjust: none; }
      * { box-sizing: border-box; -webkit-box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #f7f3ec !important; color: #1f1a16 !important;
        font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
        font-size: 15px; line-height: 1.75; overflow-x: hidden; min-height: 100vh;
        letter-spacing: 0.01em; -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #f7f3ec !important; color: #1f1a16 !important; }
      }

      /* 導覽列（保留主網站 header） */
      .site-header {
        position: fixed !important; top: 0; left: 0; width: 100%; z-index: 100;
        background: rgba(247,243,236,0.92) !important;
        border-bottom: 1px solid #e8e0d4 !important;
        padding: 0.7rem 2rem;
        display: flex; align-items: center; justify-content: center;
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
      }
      .site-brand {
        position: absolute; left: 2rem;
        display: flex; align-items: center; gap: 0.55rem;
        text-decoration: none; color: #1f1a16 !important;
        font-weight: 600; font-size: 0.92rem;
      }
      .site-brand-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #d8cdbc; }
      .site-brand-text { white-space: nowrap; color: #1f1a16 !important; }
      .site-nav { display: flex; align-items: center; gap: 0.1rem; flex-wrap: wrap; justify-content: center; }
      .site-nav a { color: #5c534a !important; text-decoration: none; padding: 0.4rem 0.75rem; font-size: 0.85rem; border-radius: 8px; }
      .site-nav a:hover, .site-nav a[aria-current="page"] { color: #b2562a !important; background: #f2e5d8 !important; }
      .site-status { position: absolute; right: 2rem; color: #9c9188 !important; font-size: 0.7rem; letter-spacing: 0.15em; font-family: "SF Mono", monospace; }

      /* 主容器 */
      .app { max-width: 640px; margin: 0 auto; padding: 6.5rem 1.25rem 7rem; position: relative; }

      /* 狀態列 */
      .status {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.75rem 0 1.5rem; border-bottom: 1px solid #e8e0d4; margin-bottom: 2rem;
        font-size: 0.75rem; letter-spacing: 0.08em; color: #9c9188 !important;
        font-family: "SF Mono", monospace;
      }
      .status-time { color: #1f1a16 !important; font-weight: 500; font-variant-numeric: tabular-nums; }
      .status-loc { display: flex; align-items: center; gap: 0.4rem; }
      .status-loc span { color: #9c9188 !important; }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5c6b4f; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

      /* 畫面 */
      .screen { display: none; }
      .screen.active { display: block; animation: screenIn 0.4s cubic-bezier(0.2,0.7,0.3,1); }
      @keyframes screenIn { from{opacity:0;transform:translateX(12px);} to{opacity:1;transform:translateX(0);} }

      /* 子頁面標題 */
      .sub-header {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.5rem 0 1.5rem; margin-bottom: 1.5rem;
        border-bottom: 1px solid #e8e0d4;
      }
      .back-btn {
        flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
        background: #ffffff; border: 1px solid #e8e0d4;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .back-btn:hover { border-color: #b2562a; }
      .back-btn svg { width: 18px; height: 18px; stroke: #1f1a16; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sub-header .sub-title-text {
        font-family: "Noto Serif TC", serif;
        font-size: 1.1rem; font-weight: 500;
        color: #1f1a16; flex: 1;
      }

      /* 逐字 */
      .ch { display: inline-block; opacity: 0; animation: chIn 0.4s cubic-bezier(0.2,0.7,0.3,1) forwards; }
      @keyframes chIn { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }

      .btn, .btn *, .skip, .skip *, .tag, .tag *,
      .site-header *, .status *, .eyebrow *,
      .map-wrap *, .metro-map *, .qr-box *, .nav-tab,
      .step-num, .route-step *, .guide-icon *,
      .card *, .chip, .chip *, .exit-number *,
      .badge *, .points-bar *, .back-btn *,
      .sub-header *, .me-item * {
        animation: none !important;
      }

      /* 標題 */
      .eyebrow {
        display: block; font-size: 0.7rem; letter-spacing: 0.22em;
        color: #9c9188 !important; text-transform: uppercase;
        margin-bottom: 0.6rem; font-family: "SF Mono", monospace;
      }
      .eyebrow .idx { color: #b2562a !important; font-weight: 500; }
      h2.title {
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 1.55rem; font-weight: 500; line-height: 1.5;
        color: #1f1a16 !important; margin: 0 0 1.5rem;
      }
      h3.sub-title {
        font-family: "Noto Serif TC", serif;
        font-size: 1.15rem; font-weight: 500;
        color: #1f1a16 !important; margin: 2rem 0 1rem;
      }
      p.lead { color: #5c534a !important; font-size: 0.95rem; margin: 0 0 1.25rem; line-height: 1.85; }

      /* 按鈕 */
      .btn {
        display: flex; align-items: center; justify-content: space-between;
        gap: 0.75rem; width: 100%; padding: 1rem 1.25rem;
        background: #1f1a16 !important; color: #f7f3ec !important;
        border: none; border-radius: 14px;
        font-family: inherit; font-size: 0.95rem; font-weight: 500;
        letter-spacing: 0.05em; cursor: pointer;
        transition: background 0.25s, transform 0.15s;
        -webkit-tap-highlight-color: transparent; text-align: left;
      }
      .btn span { color: inherit !important; }
      .btn:hover { background: #33291f !important; }
      .btn:active { transform: scale(0.985); }
      .btn .arrow { display: inline-block; transition: transform 0.25s; }
      .btn:hover .arrow { transform: translateX(3px); }
      .btn.ghost { background: transparent !important; color: #1f1a16 !important; border: 1px solid #d8cdbc; }
      .btn.ghost:hover { background: #ffffff !important; }
      .btn.accent { background: #b2562a !important; color: #ffffff !important; }
      .btn.accent:hover { background: #9c4823 !important; }
      .btn.metro { background: #1f3a5f !important; color: #ffffff !important; }
      .btn.metro:hover { background: #162a45 !important; }
      .btn-row { display: flex; gap: 0.65rem; margin-top: 1.5rem; }
      .btn-row .btn { flex: 1; }

      .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

      /* 首頁大按鈕 */
      .hero-action {
        background: linear-gradient(135deg, #1f3a5f 0%, #162a45 100%);
        color: #ffffff; border-radius: 20px;
        padding: 1.75rem 1.5rem; margin-bottom: 1.75rem;
        position: relative; overflow: hidden;
        cursor: pointer; text-align: left; width: 100%;
        border: none; font-family: inherit;
        box-shadow: 0 8px 28px rgba(31,58,95,0.2);
        transition: transform 0.2s;
      }
      .hero-action:hover { transform: translateY(-2px); }
      .hero-action::before {
        content: ""; position: absolute; top: -50%; right: -20%;
        width: 200px; height: 200px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
      }
      .hero-action .ha-label {
        font-family: "SF Mono", monospace; font-size: 0.65rem;
        letter-spacing: 0.28em; text-transform: uppercase;
        color: #b8c8dc; margin-bottom: 0.5rem; position: relative;
      }
      .hero-action .ha-title {
        font-family: "Noto Serif TC", serif;
        font-size: 1.35rem; font-weight: 600; color: #ffffff;
        margin-bottom: 0.35rem; position: relative;
      }
      .hero-action .ha-sub { font-size: 0.85rem; color: #d8e2ef; line-height: 1.7; position: relative; }
      .hero-action .ha-icon {
        position: absolute; top: 1.75rem; right: 1.5rem;
        width: 44px; height: 44px; color: #ffffff; opacity: 0.9;
      }
      .hero-action .ha-icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.2; fill: none; }

      /* 快速入口 */
      .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem; }
      .quick-card {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 16px; padding: 1.25rem 1rem;
        cursor: pointer; transition: all 0.2s;
        text-align: left; font-family: inherit;
        display: flex; flex-direction: column; gap: 0.6rem;
      }
      .quick-card:hover { border-color: #b2562a; transform: translateY(-2px); }
      .quick-card .qc-icon {
        width: 40px; height: 40px; border-radius: 12px;
        background: #f2e5d8; color: #b2562a;
        display: flex; align-items: center; justify-content: center;
      }
      .quick-card .qc-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .quick-card .qc-label { font-family: "SF Mono", monospace; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: #9c9188; }
      .quick-card .qc-title { font-size: 0.95rem; font-weight: 500; color: #1f1a16; line-height: 1.4; }

      /* 推薦卡 */
      .reco-card {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 16px; padding: 1.25rem;
        margin-bottom: 0.75rem; cursor: pointer;
        transition: all 0.2s;
        display: flex; gap: 1rem; align-items: flex-start;
      }
      .reco-card:hover { border-color: #b2562a; }
      .reco-card .rc-badge {
        padding: 0.2rem 0.55rem; background: #f2e5d8; border-radius: 999px;
        font-family: "SF Mono", monospace; font-size: 0.62rem;
        letter-spacing: 0.1em; color: #b2562a;
        text-transform: uppercase; margin-bottom: 0.4rem;
        display: inline-block;
      }
      .reco-card .rc-body { flex: 1; min-width: 0; }
      .reco-card .rc-title { font-size: 0.98rem; font-weight: 500; color: #1f1a16; margin-bottom: 0.25rem; }
      .reco-card .rc-desc { font-size: 0.83rem; color: #5c534a; line-height: 1.7; }
      .reco-card .rc-points { font-family: "Noto Serif TC", serif; font-size: 1.15rem; font-weight: 700; color: #b2562a; flex-shrink: 0; }
      .reco-card .rc-points::after { content: "P"; font-size: 0.7rem; margin-left: 1px; color: #9c9188; }

      /* 地圖 */
      .map-wrap {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 20px; overflow: hidden; margin-bottom: 1.5rem; position: relative;
      }
      .map-svg { display: block; width: 100%; height: auto; background: #fbf8f3; }
      .map-pin { cursor: pointer; }
      .map-pin .pin-dot { fill: #ffffff; stroke: #b2562a; stroke-width: 2.5; transition: all 0.25s; }
      .map-pin .pin-dot-inner { fill: #b2562a; transition: all 0.25s; }
      .map-pin .pin-label { fill: #1f1a16; font-family: "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; pointer-events: none; }
      .map-hint {
        position: absolute; top: 0.75rem; left: 0.75rem;
        padding: 0.3rem 0.7rem; background: rgba(255,255,255,0.92);
        border: 1px solid #e8e0d4; border-radius: 999px;
        font-family: "SF Mono", monospace; font-size: 0.68rem;
        letter-spacing: 0.12em; color: #9c9188 !important; text-transform: uppercase;
      }

      /* chips */
      .chips {
        display: flex; gap: 0.5rem; overflow-x: auto;
        padding-bottom: 0.75rem; margin-bottom: 1.5rem;
        -webkit-overflow-scrolling: touch; scrollbar-width: none;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex-shrink: 0; padding: 0.5rem 1rem;
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 999px; font-family: inherit;
        font-size: 0.85rem; color: #5c534a;
        cursor: pointer; transition: all 0.2s; white-space: nowrap;
      }
      .chip.active { background: #1f1a16; color: #f7f3ec; border-color: #1f1a16; }

      /* 卡片 */
      .card {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 16px; padding: 1.25rem;
        margin-bottom: 0.75rem; transition: all 0.2s;
        cursor: pointer;
      }
      .card:hover { border-color: #b2562a; }
      .card-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap;
      }
      .card-head .name { font-size: 1rem; font-weight: 500; color: #1f1a16; }
      .card-head .district { font-family: "SF Mono", monospace; font-size: 0.72rem; color: #9c9188; }
      .card .desc { font-size: 0.85rem; color: #5c534a; line-height: 1.75; }
      .card .meta {
        display: flex; gap: 1rem; margin-top: 0.6rem;
        font-size: 0.72rem; color: #9c9188;
        font-family: "SF Mono", monospace; flex-wrap: wrap;
      }

      /* 點數 */
      .points-hero {
        background: linear-gradient(135deg, #b2562a 0%, #9c4823 100%);
        color: #ffffff; border-radius: 20px;
        padding: 1.75rem 1.5rem; margin-bottom: 1.5rem;
        position: relative; overflow: hidden;
        box-shadow: 0 8px 28px rgba(178,86,42,0.25);
      }
      .points-hero::before {
        content: ""; position: absolute; top: -40%; right: -20%;
        width: 220px; height: 220px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
      }
      .points-hero .ph-label {
        font-family: "SF Mono", monospace; font-size: 0.68rem;
        letter-spacing: 0.28em; text-transform: uppercase;
        color: #ffe0d0; margin-bottom: 0.4rem; position: relative;
      }
      .points-hero .ph-value {
        font-family: "Noto Serif TC", serif;
        font-size: 3.2rem; font-weight: 700; line-height: 1;
        color: #ffffff; font-variant-numeric: tabular-nums; position: relative;
      }
      .points-hero .ph-value::after { content: "P"; font-size: 1.2rem; margin-left: 0.3rem; color: #ffe0d0; font-weight: 500; }
      .points-hero .ph-sub { font-size: 0.82rem; color: #ffe0d0; margin-top: 0.5rem; position: relative; }

      /* 徽章 */
      .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.75rem; }
      .badge {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 14px; padding: 1rem 0.5rem;
        text-align: center; transition: all 0.2s; cursor: pointer;
      }
      .badge.locked { opacity: 0.4; }
      .badge.unlocked { border-color: #b2562a; }
      .badge .badge-icon {
        width: 44px; height: 44px; border-radius: 50%;
        margin: 0 auto 0.5rem;
        display: flex; align-items: center; justify-content: center;
        background: #f2e5d8; color: #b2562a;
      }
      .badge.locked .badge-icon { background: #e8e0d4; color: #9c9188; }
      .badge .badge-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .badge .badge-name { font-size: 0.75rem; color: #1f1a16; font-weight: 500; line-height: 1.3; }
      .badge.locked .badge-name { color: #9c9188; }

      /* QR */
      .qr-box {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 20px; padding: 2rem 1.5rem;
        margin-bottom: 1.5rem; text-align: center;
      }
      .qr-frame {
        width: 180px; height: 180px; margin: 0 auto 1.5rem;
        border: 2px solid #b2562a; border-radius: 16px;
        position: relative; overflow: hidden; background: #fbf8f3;
        display: flex; align-items: center; justify-content: center;
      }
      .qr-frame::before, .qr-frame::after {
        content: ""; position: absolute; width: 24px; height: 24px;
        border: 3px solid #b2562a;
      }
      .qr-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 14px 0 0 0; }
      .qr-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 14px 0; }
      .qr-frame svg { width: 130px; height: 130px; fill: #1f1a16; }
      .qr-line {
        position: absolute; left: 0; width: 100%; height: 3px;
        background: linear-gradient(90deg, transparent, #b2562a, transparent);
        animation: qrScan 2s ease-in-out infinite;
      }
      @keyframes qrScan {
        0%,100% { top: 8%; opacity: 0.5; }
        50% { top: 92%; opacity: 1; }
      }
      .qr-title {
        font-family: "Noto Serif TC", serif;
        font-size: 1.15rem; font-weight: 500;
        color: #1f1a16 !important; margin-bottom: 0.5rem;
      }
      .qr-sub { font-size: 0.88rem; color: #5c534a !important; line-height: 1.75; }

      /* 智慧路徑 */
      .smart-route {
        background: linear-gradient(135deg, #ffffff 0%, #fbf8f3 100%);
        border: 2px solid #1f3a5f; border-radius: 22px;
        margin-bottom: 1.75rem; overflow: hidden;
        box-shadow: 0 8px 32px rgba(31,58,95,0.12);
      }
      .smart-route-header {
        background: #1f3a5f; color: #ffffff; padding: 0.9rem 1.5rem;
        display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      }
      .smart-route-header .h-label {
        font-family: "SF Mono", monospace; font-size: 0.68rem;
        letter-spacing: 0.25em; text-transform: uppercase; color: #b8c8dc;
      }
      .smart-route-header .h-title {
        font-family: "Noto Serif TC", serif; font-size: 1.05rem; font-weight: 500; color: #ffffff;
      }
      .smart-route-body { padding: 1.75rem 1.5rem 1.5rem; }
      .exit-block { text-align: center; padding-bottom: 1.5rem; border-bottom: 1px dashed #d8cdbc; margin-bottom: 1.5rem; }
      .exit-block .exit-label {
        font-family: "SF Mono", monospace; font-size: 0.7rem;
        letter-spacing: 0.3em; color: #9c9188 !important;
        text-transform: uppercase; margin-bottom: 0.5rem;
      }
      .exit-block .exit-number {
        font-family: "Noto Serif TC", serif; font-size: 3.2rem;
        font-weight: 700; color: #1f3a5f; line-height: 1; margin-bottom: 0.5rem;
      }
      .exit-block .exit-number .unit { font-size: 1.4rem; color: #b2562a; font-weight: 500; margin-left: 0.25rem; }
      .exit-block .exit-name { font-size: 0.95rem; color: #5c534a !important; }

      .route-steps { display: flex; flex-direction: column; }
      .route-step { display: flex; gap: 1rem; padding: 0.9rem 0; position: relative; }
      .route-step::before {
        content: ""; position: absolute; left: 15px; top: 2.6rem; bottom: -0.5rem;
        width: 1px; background: #d8cdbc;
      }
      .route-step:last-child::before { display: none; }
      .route-step-icon {
        flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
        background: #f2e5d8; color: #b2562a;
        display: flex; align-items: center; justify-content: center;
        position: relative; z-index: 1; border: 2px solid #ffffff;
      }
      .route-step-icon svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .route-step-body { flex: 1; min-width: 0; padding-top: 0.15rem; }
      .route-step-body .step-label {
        font-family: "SF Mono", monospace; font-size: 0.68rem;
        letter-spacing: 0.15em; color: #b2562a !important;
        text-transform: uppercase; margin-bottom: 0.15rem;
      }
      .route-step-body .step-main {
        font-size: 0.98rem; color: #1f1a16 !important;
        font-weight: 500; line-height: 1.55; margin-bottom: 0.15rem;
      }
      .route-step-body .step-sub { font-size: 0.82rem; color: #5c534a !important; line-height: 1.7; }

      .smart-route-tip {
        margin-top: 1.25rem; padding: 0.85rem 1rem;
        background: #f2e5d8; border-radius: 12px;
        font-size: 0.82rem; color: #5c534a !important; line-height: 1.7;
        display: flex; gap: 0.6rem; align-items: flex-start;
      }
      .smart-route-tip .tip-icon { flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px; color: #b2562a; }
      .smart-route-tip .tip-icon svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 2; fill: none; }

      /* 禮儀卡 */
      .guide-cards { display: grid; gap: 1rem; margin-bottom: 1.75rem; }
      .guide-card {
        background: #ffffff; border: 1px solid #e8e0d4;
        border-radius: 16px; padding: 1.25rem;
        display: flex; gap: 1rem; align-items: flex-start;
        cursor: pointer; transition: all 0.2s;
      }
      .guide-card:hover { border-color: #b2562a; }
      .guide-icon {
        flex-shrink: 0; width: 48px; height: 48px;
        border-radius: 12px; background: #f2e5d8;
        display: flex; align-items: center; justify-content: center; color: #b2562a;
      }

            <div class="guide-cards">
              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20h.01M17 20h3v-3"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 01</span><span class="title-sm">先掃站點地圖</span></div>
                  <p>進站後，先掃描牆上的站點地圖 QR code。台北許多站名是音譯，光看漢字不容易對應實際位置。</p>
                </div>
              </div>

              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><path d="M3 20h4v-4h4v-4h4V8h4V4"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 02</span><span class="title-sm">走樓梯前，先看月台方向</span></div>
                  <p>樓梯口上方會標示「往 ○○ 方向」。請確認您的列車方向，再決定走哪一道樓梯。走錯了，往往要多繞一層樓。</p>
                </div>
              </div>

              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><path d="M3 17l4-4 4 2 4-6 6-4"/><circle cx="18" cy="5" r="1.5"/><circle cx="6" cy="19" r="1.5"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 03</span><span class="title-sm">電扶梯靠右站</span></div>
                  <p>在台北，電扶梯有一個潛規則：<strong>靠右站、左側通行</strong>。趕時間的人會從左邊走過去。這是城市裡對彼此的一份體貼。</p>
                </div>
              </div>

              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 04</span><span class="title-sm">月台排隊，照地上的線站</span></div>
                  <p>月台地上畫有排隊線與「等候區」。請站在線後，讓下車的人先走出來，再依序上車。</p>
                </div>
              </div>

              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M7 8l5-5 5 5"/><path d="M7 16l5 5 5-5"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 05</span><span class="title-sm">先出後進</span></div>
                  <p>車門打開時，先讓裡面的人下車。這是台北捷運最基本、也最重要的一個默契。</p>
                </div>
              </div>

              <div class="guide-card">
                <div class="guide-icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v5H8z"/><path d="M8 9c-2 0-3 2-3 4v5c0 1.5 1 3 3 3h8c2 0 3-1.5 3-3v-5c0-2-1-4-3-4"/></svg></div>
                <div class="guide-body">
                  <div class="guide-card-head"><span class="step-num">GUIDE · 06</span><span class="title-sm">書包建議前背</span></div>
                  <p>車廂擁擠時，請把背包或書包改背在胸前。這樣可以少佔一些空間，也不會在轉身時不小心撞到別人。</p>
                </div>
              </div>
            </div>
          `;
        }

        /* ============ 畫面：我的 ============ */
        function viewMe() {
          return html`
            ${statusBar()}
            <span class="eyebrow"><span class="idx">06</span> · 我的</span>
            <h2 class="title">我的旅程</h2>

            <div class="points-hero">
              <div class="ph-label">Total Points</div>
              <div class="ph-value" data-no-type id="points-display-2">0</div>
              <div class="ph-sub">繼續探索，累積更多點數</div>
            </div>

            <div class="me-list">
              <button class="me-item" onclick="switchTab('quest')">
                <div class="me-item-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg></div>
                <div class="me-item-body">
                  <div class="mi-title">我的徽章</div>
                  <div class="mi-desc">1 個徽章已解鎖</div>
                </div>
                <span class="mi-arrow">→</span>
              </button>

              <button class="me-item" onclick="switchTab('route')">
                <div class="me-item-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg></div>
                <div class="me-item-body">
                  <div class="mi-title">我的行程</div>
                  <div class="mi-desc">尚無儲存的行程</div>
                </div>
                <span class="mi-arrow">→</span>
              </button>

              <button class="me-item" onclick="switchTab('explore')">
                <div class="me-item-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
                <div class="me-item-body">
                  <div class="mi-title">我的最愛</div>
                  <div class="mi-desc">3 個景點</div>
                </div>
                <span class="mi-arrow">→</span>
              </button>

              <button class="me-item">
                <div class="me-item-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
                <div class="me-item-body">
                  <div class="mi-title">語言設定</div>
                  <div class="mi-desc">日本語</div>
                </div>
                <span class="mi-arrow">→</span>
              </button>

              <button class="me-item">
                <div class="me-item-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
                <div class="me-item-body">
                  <div class="mi-title">關於智慧遊台北</div>
                  <div class="mi-desc">v4.0</div>
                </div>
                <span class="mi-arrow">→</span>
              </button>
            </div>
          `;
        }

        /* ============ 渲染 ============ */
        function render() {
          var view = currentView();
          var app = document.getElementById('app');
          var content = '';

          switch (view.page) {
            case 'home': content = viewHome(); break;
            case 'explore': content = viewExplore(); break;
            case 'spot': content = viewSpot(view.params.id); break;
            case 'route': content = viewRoute(); break;
            case 'smart': content = viewSmart(); break;
            case 'quest': content = viewQuest(); break;
            case 'scanning': content = viewScanning(); break;
            case 'guide': content = viewGuide(); break;
            case 'me': content = viewMe(); break;
            default: content = viewHome();
          }

          app.innerHTML = content;

          /* 更新底部 tab */
          var navHtml = '';
          var tabs = [
            { id: 'home', label: '首頁', icon: '<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/>' },
            { id: 'explore', label: '探索', icon: '<circle cx="12" cy="12" r="9"/><path d="M16 8l-2 6-6 2 2-6z"/>' },
            { id: 'quest', label: '尋寶', icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20h.01M17 20h3v-3"/>' },
            { id: 'me', label: '我的', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>' }
          ];
          for (var i = 0; i < tabs.length; i++) {
            var t = tabs[i];
            var isActive = currentTab === t.id ? ' active' : '';
            navHtml += '<button class="nav-tab' + isActive + '" onclick="switchTab(\'' + t.id + '\')">' +
              '<svg viewBox="0 0 24 24">' + t.icon + '</svg>' +
              '<span class="nav-label">' + t.label + '</span>' +
            '</button>';
          }
          document.getElementById('bottom-nav').innerHTML = navHtml;

          /* 更新時鐘 */
          tick();
        }

        /* ============ 導航 ============ */
        function switchTab(name) {
          currentTab = name;
          state.stack = [name];
          render();
          scrollToTop();
        }

        function push(page, params) {
          state.stack.push({ page: page, params: params || {} });
          render();
          scrollToTop();
        }

        function back() {
          if (state.stack.length > 1) state.stack.pop();
          render();
          scrollToTop();
        }

        function openSpot(id) {
          push('spot', { id: id });
        }

        function filterCategory(el, cat) {
          var chips = document.querySelectorAll('.chip');
          for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
          if (el) el.classList.add('active');

          var cards = document.querySelectorAll('#spot-list .card');
          for (var j = 0; j < cards.length; j++) {
            var c = cards[j].getAttribute('data-cat');
            if (cat === 'all' || c === cat) cards[j].style.display = '';
            else cards[j].style.display = 'none';
          }
        }

        function startScan() {
          state.stack.push({ page: 'scanning', params: {} });
          render();
          setTimeout(function () {
            state.points += 10;
            state.stack.pop();
            render();
          }, 1800);
        }

        function tick() {
          var t = getTime();
          var clock = document.getElementById('clock');
          var nt = document.getElementById('now-time');
          var pd = document.getElementById('points-display');
          var pd2 = document.getElementById('points-display-2');
          var g = document.getElementById('greeting');
          if (clock) clock.textContent = t.hh + ':' + t.mm + ':' + t.ss;
          if (nt) nt.textContent = t.hh + ':' + t.mm;
          if (pd) pd.textContent = state.points;
          if (pd2) pd2.textContent = state.points;
          if (g) g.textContent = getGreeting();
        }

        function scrollToTop() {
          try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
          catch (e) { window.scrollTo(0, 0); }
        }

        function currentView() {
          return state.stack[state.stack.length - 1];
        }

        /* ============ 啟動 ============ */
        function boot() {
          render();
          setInterval(tick, 1000);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(boot, 1);
        } else if (document.addEventListener) {
          document.addEventListener('DOMContentLoaded', boot, false);
          window.addEventListener('load', boot, false);
        }

        window.switchTab = switchTab;
        window.push = push;
        window.back = back;
        window.openSpot = openSpot;
        window.filterCategory = filterCategory;
        window.startScan = startScan;
      })();
    </script>
  </body>
</html>
