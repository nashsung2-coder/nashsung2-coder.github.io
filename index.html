<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- 導覽設定：首頁會固定顯示在第一位。 -->
    <meta name="site-nav-title" content="首頁" />
    <meta name="site-nav-order" content="0" />
    <meta name="site-nav-visible" content="true" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="可由 HTML 頁面中繼資料自動排序的 GitHub Pages 導覽框架。" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <title>Nash Pages</title>
  </head>
  <body>
    <!-- 保留此導覽列與 nav.js；新增頁面時不需要手動修改導覽列。 -->
    <header class="site-header" data-site-navigation>
      <a class="site-brand" href="/">NASH / PAGES</a>
      <nav class="site-nav" aria-label="網站導覽" data-navigation-list></nav>
      <span class="site-status">STATIC INDEX</span>
    </header>
    <!-- 首頁保持空白。請在 pages/ 內新增 HTML 頁面。 -->
    <main class="empty-home" aria-label="空白首頁"></main>
    <script src="assets/js/nav.js"></script>
  </body>
</html>
