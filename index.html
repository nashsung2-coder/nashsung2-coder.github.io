<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta name="site-nav-title" content="想說的話" />
    <meta name="site-nav-order" content="30" />
    <meta name="site-nav-visible" content="true" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>想說的話 — Nash Pages</title>
    <link rel="stylesheet" href="../assets/css/site.css" />

    <style>
      body {
        margin: 0;
        background: #050510;
        color: #f0f4ff;
        font-family: "Noto Sans TC", "微軟正黑體", "Microsoft JhengHei",
          sans-serif;
        line-height: 1.8;
        overflow-x: hidden;
      }

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
        background: rgba(5, 5, 16, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 240, 255, 0.35);
        padding: 0.6rem 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .site-brand {
        position: absolute;
        left: 2rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        color: #00f0ff;
        font-weight: 700;
        letter-spacing: 2px;
        font-size: 1rem;
        text-shadow: 0 0 8px #00f0ff, 0 0 20px rgba(0, 240, 255, 0.4);
        transition: all 0.3s;
      }

      .site-brand:hover {
        text-shadow: 0 0 12px #00f0ff, 0 0 30px rgba(0, 240, 255, 0.7);
        color: #fff;
      }

      .site-brand-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #00f0ff;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        flex-shrink: 0;
      }

      .site-brand-text {
        white-space: nowrap;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 0.2rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .site-nav a {
        color: #d0d8f0;
        text-decoration: none;
        padding: 0.4rem 0.8rem;
        letter-spacing: 1px;
        font-size: 0.9rem;
        transition: all 0.3s;
        border: 1px solid transparent;
      }

      .site-nav a:hover,
      .site-nav a.active {
        color: #ffffff;
        border-color: #00f0ff;
        text-shadow: 0 0 6px #00f0ff;
        background: rgba(0, 240, 255, 0.1);
      }

      .site-status {
        position: absolute;
        right: 2rem;
        color: #39ff14;
        font-size: 0.7rem;
        letter-spacing: 3px;
        animation: pulse-status 2s ease-in-out infinite;
        white-space: nowrap;
      }

      @keyframes pulse-status {
        0%, 100% { opacity: 1; text-shadow: 0 0 4px #39ff14; }
        50% { opacity: 0.5; text-shadow: none; }
      }

      .page-content {
        max-width: 760px;
        margin: 0 auto;
        padding: 7rem 2rem 5rem;
      }

      .page-kicker {
        color: #ff6bb8;
        font-size: 0.75rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        border-left: 2px solid #ff2d95;
        padding-left: 0.8rem;
        font-weight: 600;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 900;
        background: linear-gradient(120deg, #ffffff, #7ef9ff, #d4a5ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 1rem;
      }

      p {
        color: #ffffff;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
        margin-bottom: 1.5rem;
      }

      a {
        color: #7ef9ff;
        text-decoration: none;
        border-bottom: 1px dotted rgba(126, 249, 255, 0.5);
        transition: all 0.3s;
      }

      a:hover {
        color: #ffffff;
        text-shadow: 0 0 8px #00f0ff;
      }

      @media (max-width: 600px) {
        .site-brand-text { font-size: 0.85rem; }
        .site-status { display: none; }
        .page-content { padding: 6rem 1.2rem 3rem; }
        .site-brand { left: 1rem; }
        .site-header { padding: 0.6rem 1rem; }
      }
    </style>
  </head>
  <body>
    <header class="site-header" data-site-navigation>
      <a class="site-brand" href="/" aria-label="宋嵐緒個人頁面首頁">
        <img
          class="site-brand-avatar"
          src="../assets/images/avatar-circle.png"
          alt="宋嵐緒的角色插圖"
        />
        <span class="site-brand-text">宋嵐緒個人頁面</span>
      </a>
      <nav class="site-nav" aria-label="網站導覽" data-navigation-list></nav>
      <span class="site-status">STATIC INDEX</span>
    </header>

    <main class="page-content">
      <p class="page-kicker">WORDS / 30</p>
      <h1>想說的話</h1>

      <p>
        很多人的人生，最後都停在「妥協」兩個字。我的想法是，讓人生可以有「選擇」。
      </p>

      <p>
        我不太會說話。我比較會做。所以，做吧。
      </p>

      <p>
        如果你看完之後，有任何想法，或是你也有一些想做的事情，歡迎寫信給我。
      </p>

      <p>
        信箱：<a href="mailto:nashsung2@gmail.com">nashsung2@gmail.com</a>
      </p>

      <p style="margin-top: 3rem; font-style: italic; color: #8ef6ff;">
        網站還在慢慢長。謝謝你來。
      </p>
    </main>

    <script src="../assets/js/nav.js"></script>
  </body>
</html>
